name: Swift

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  investor-kit:
    name: InvestorKit (Linux)
    runs-on: ubuntu-latest
    env:
      INVESTORKIT_ONLY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: '5.10'
      - run: swift --version
      - run: swift build
      - run: swift test

  legacy-app:
    name: Legacy app target (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift build
      - run: swift test --filter InvestorKitTests
